{% extends "base.html" %}

{% block title %}Register Account — UPI Without Internet{% endblock %}

{% block content %}
<div class="row justify-content-center py-4">
    <div class="col-md-6 col-lg-5">
        <div class="card-fintech">
            <div class="text-center mb-4">
                <div class="brand-icon mb-2"><i class="fa-solid fa-user-plus text-teal fa-2x"></i></div>
                <h4 class="fw-bold text-white">Create Account</h4>
                <p class="text-xs text-slate-400">Registers user and auto-generates client RSA-2048 signing keys</p>
            </div>

            <form action="{{ url_for('auth.register') }}" method="POST">
                <div class="mb-3">
                    <label class="form-label text-xs text-slate-300 text-uppercase fw-semibold">Full Name</label>
                    <input type="text" name="full_name" class="form-control bg-navy-accent border-navy text-white" placeholder="e.g. Vikram Batra" required>
                </div>
                <div class="row g-2 mb-3">
                    <div class="col-md-6">
                        <label class="form-label text-xs text-slate-300 text-uppercase fw-semibold">Username</label>
                        <input type="text" name="username" class="form-control bg-navy-accent border-navy text-white font-mono" placeholder="e.g. vikram" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label text-xs text-slate-300 text-uppercase fw-semibold">Email Address</label>
                        <input type="email" name="email" class="form-control bg-navy-accent border-navy text-white font-mono" placeholder="vikram@example.com" required>
                    </div>
                </div>
                <div class="row g-2 mb-4">
                    <div class="col-md-6">
                        <label class="form-label text-xs text-slate-300 text-uppercase fw-semibold">Password</label>
                        <input type="password" name="password" class="form-control bg-navy-accent border-navy text-white font-mono" placeholder="••••••••" required>
                    </div>
                    <div class="col-md-6">
                        <label class="form-label text-xs text-slate-300 text-uppercase fw-semibold">Confirm Password</label>
                        <input type="password" name="confirm_password" class="form-control bg-navy-accent border-navy text-white font-mono" placeholder="••••••••" required>
                    </div>
                </div>
                <button type="submit" class="btn btn-teal w-100 py-2">
                    <i class="fa-solid fa-key me-1"></i> Register & Generate Keypair
                </button>
            </form>

            <div class="text-center mt-3 text-xs text-slate-400">
                Already registered? <a href="{{ url_for('auth.login') }}" class="text-teal">Sign In</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
